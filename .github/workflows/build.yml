name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build native targets
        run: cmake --build build --config Release --parallel

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Publish WPF application
        run: dotnet publish ui/CloudRedirect.csproj -c Release -r win-x64 --self-contained false -o ui/bin/publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudRedirect-win-x64
          path: ui/bin/publish/CloudRedirect.exe
          if-no-files-found: error
