name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the build as a GitHub release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build native targets
        run: cmake --build build --config Release --parallel

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Publish WPF application
        run: dotnet publish ui/CloudRedirect.csproj -c Release -r win-x64 --self-contained false -o ui/bin/publish --no-restore

      - name: Package release asset
        if: inputs.publish_release
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw Version.props
          $version = $props.Project.PropertyGroup.ReleaseVersion
          $prerelease = [string]$props.Project.PropertyGroup.ReleasePrerelease
          $fullVersion = "$version$prerelease"
          $tag = "v$fullVersion"
          $releaseName = "CloudRedirect $fullVersion"
          $asset = "CloudRedirect-$fullVersion-win-x64.zip"

          if (Test-Path $asset) { Remove-Item $asset -Force }
          Compress-Archive -Path "ui/bin/publish/*" -DestinationPath $asset -CompressionLevel Optimal

          "VERSION=$fullVersion" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
          "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudRedirect-win-x64
          path: ui/bin/publish/CloudRedirect.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $existing = gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release/tag $env:TAG already exists. Bump ReleaseVersion or change ReleasePrerelease in Version.props."
          }

          $args = @(
            "release", "create", $env:TAG,
            "--title", $env:RELEASE_NAME,
            "--generate-notes",
            "--target", $env:GITHUB_SHA,
            $env:ASSET
          )

          if ($env:VERSION -match '-') {
            $args += "--prerelease"
          }

          gh @args
